
version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "migrations/001_create_users.up.sql"
      - "migrations/002_create_workspaces.up.sql"
      - "migrations/003_create_scrum_models.up.sql"
      - "migrations/004_create_collaboration_tables.up.sql"
      - "migrations/005_normalize_sprint_story_membership.up.sql"
